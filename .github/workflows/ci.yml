name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Terminal tests
        working-directory: C1Terminal
        run: go test ./...
      - name: News tests
        working-directory: C1News
        run: go test ./...
      - name: Python syntax
        run: python -m compileall -q C1Bible C1LavaX C1Mota C1News C1Sudoku launcher
      - name: Publication preflight
        shell: pwsh
        run: ./tools/preflight.ps1
